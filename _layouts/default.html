---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">

    <!-- SEO Meta Tags -->
    <meta name="description" content="Jaume Lab — AI for Oncologic Pathology. Agentic, multimodal and foundational.">
    <meta name="keywords" content="AI for Pathology, computational pathology, foundation models, oncology, Jaume Lab">
    <!-- Open Graph Meta Tags for Social Media -->
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="AI for Oncologic Pathology. Agentic, multimodal and foundational.">
    <meta property="og:image" content="{{ site.url }}/assets/people/jaumelab_logo_v2.png">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ base_path }}/assets/people/jaumelab_logo_v2.png">

    <style>
      /* Reset default margins and paddings */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
        scroll-behavior: smooth;
      }

      body {
        display: flex;
        flex-direction: column;
        height: 100%;
        font-size: 90%;
        font-family: var(--font-sans);
        line-height: 1.6;
        background-color: var(--c-surface);
        color: var(--c-text);
      }

      a {
        color: var(--c-accent);
        text-decoration: none;
        transition: color 0.3s ease;
      }

      a:hover {
        color: var(--c-accent-dark);
        text-decoration: underline;
      }

      /* Hero banner email — must stay white on the dark blue header on every page */
      .hero-section .hero-email a,
      .hero-section .hero-email a:link,
      .hero-section .hero-email a:visited,
      .hero-section .hero-email a:hover,
      .hero-section .hero-email a:focus,
      .hero-section .hero-email a:active {
        color: #ffffff !important;
        text-decoration: none;
      }

      .hero-section .hero-email a:hover {
        opacity: 0.85;
        text-decoration: underline !important;
      }

      h1, h2, h3 {
        font-weight: bold;
      }

      h3 {
        font-size: 1.8em;
        margin-bottom: 0.5em;
      }

      p, li {
        font-weight: normal;
        margin-bottom: 15px;
      }

      ul {
        list-style-position: inside;
        padding-left: 0;
      }

      /* Back to Top Button */
      #back-to-top {
        position: fixed;
        bottom: 20px;
        right: 20px;
        display: none;
        background-color: var(--c-accent);
        color: #fff;
        border: none;
        padding: 10px;
        border-radius: 50%;
        cursor: pointer;
      }

      #back-to-top:hover {
        background-color: var(--c-accent-dark);
      }

      /* Footer */
      .page__footer {
        background-color: var(--c-text);
        color: #fff;
        padding: 10px; /* Reduced padding */
        text-align: center;
      }

      /* Responsive adjustments for smaller screens */
      @media (max-width: 768px) {
        body {
          font-size: 100%;
        }

        h3 {
          font-size: 1.5em;
        }
      }
    </style>
  </head>
  <body>
    {% include browser-upgrade.html %}
    {% include hero-banner.html %}

    <!-- Main Content -->
    {{ content }}

    <!-- Back to Top Button -->
    <button id="back-to-top">↑</button>

    <!-- Footer -->
    <div class="page__footer">
      <footer>
        <p>&copy; 2026 Guillaume Jaume</p>
      </footer>
    </div>

    {% include scripts.html %}

    <!-- Back to Top Button Script -->
    <script>
      window.addEventListener('scroll', function() {
        const backToTop = document.getElementById('back-to-top');
        if (window.pageYOffset > 300) {
          backToTop.style.display = 'block';
        } else {
          backToTop.style.display = 'none';
        }
      });
      document.getElementById('back-to-top').addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    </script>
  </body>
</html>
