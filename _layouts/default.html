---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">

    <!-- SEO Meta Tags -->
    {% assign page_desc = page.description | default: site.description %}
    <meta name="description" content="{{ page_desc | escape }}">
    <meta name="keywords" content="{{ page.keywords | default: 'AI for Pathology, computational pathology, foundation models, oncology, Jaume Lab' }}">
    <!-- Open Graph Meta Tags for Social Media -->
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page_desc | escape }}">
    <meta property="og:image" content="{{ site.url }}/assets/people/jaumelab_logo.png">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ page.title | default: site.title }}">
    <meta name="twitter:description" content="{{ page_desc | escape }}">
    <meta name="twitter:image" content="{{ site.url }}/assets/people/jaumelab_logo.png">

  </head>
  <body>
    {% include site-header.html %}
    <main>
      {{ content }}
    </main>
    {% include site-footer.html %}
  </body>
</html>
